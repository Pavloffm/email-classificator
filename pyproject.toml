[project]
name = "email-classificator"
version = "0.1.0"
description = "Email classification project."
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.63.1",
    "google-auth-oauthlib>=1.5.0",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "loguru>=0.8.0",
    "requests>=2.34.2",
]

[project.scripts]
email-classificator = "email_classificator:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
