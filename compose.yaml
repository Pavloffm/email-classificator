services:
  classifier:
    build:
      context: .
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    init: true
    restart: unless-stopped
    command: ["schedule"]
    environment:
      TZ: ${TZ:-Europe/Bratislava}
      RUN_TIMES: ${RUN_TIMES:-09:00,21:00}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      EMAIL_SECRETS_DIR: ${EMAIL_SECRETS_DIR:-/app/secrets}
      EMAIL_STATE_DIR: ${EMAIL_STATE_DIR:-/app/data}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./secrets:${EMAIL_SECRETS_DIR:-/app/secrets}:rw
      - ./data:${EMAIL_STATE_DIR:-/app/data}:rw
